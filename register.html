<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Registration</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    

    <section class="register-container">

        <h2>Create Your Student Account</h2>

        <p>Join StudentHub and manage your academic journey with ease.</p>

        <form>

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="studentid">Student ID</label>
                <input type="text" id="studentid" placeholder="Enter Student ID" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" placeholder="Enter your mobile number" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>

            

            <div class="form-group">
                <label for="department">Department</label>

                <select id="department" required>
                    <option value="">Select Department</option>
                    <option>Computer Science</option>
                    <option>Information Technology</option>
                    <option>Artificial Intelligence</option>
                    <option>Electronics</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                </select>

            </div>

            <div class="form-group">
                <label for="semester">Semester</label>

                <select id="semester" required>
                    <option value="">Select Semester</option>
                    <option>Semester 1</option>
                    <option>Semester 2</option>
                    <option>Semester 3</option>
                    <option>Semester 4</option>
                    <option>Semester 5</option>
                    <option>Semester 6</option>
                    <option>Semester 7</option>
                    <option>Semester 8</option>
                </select>

            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create Password" required>
            </div>

            <div class="form-group">
                <label for="confirm">Confirm Password</label>
                <input type="password" id="confirm" placeholder="Confirm Password" required>
            </div>

            



            </div>

            <button type="submit">
                Register
            </button>

            <p class="login-link">
                Already have an account?
                <a href="login.html">Login Here</a>
            </p>

        </form>

    </section>

    <footer>



        <center><p><h3>Empowering students with smarter academic management.</h3></p></center>
        
        <center><p>
            © 2026 StudentHub Portal | All Rights Reserved
        </p></center>

    </footer>

</body>

</html>
